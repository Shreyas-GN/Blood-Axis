# The database and backend run on Convex (cloud or self-hosted), so only the app is containerised.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
